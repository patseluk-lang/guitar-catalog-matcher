name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      # Google Chrome is preinstalled on GitHub runners; Selenium Manager fetches the matching driver.
      - name: Run unit and Selenium tests
        run: python -m pytest -v